{% extends 'accounts/base.html' %}

{% block title %}Delete Job | JobHub{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Delete Job</h1>

        <p class="auth-subtitle">
            Are you sure you want to delete this job?
        </p>

        <h3>{{ job.title }}</h3>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="primary-button">
                Yes, Delete Job
            </button>

        </form>

        <p class="auth-footer">
            <a href="{% url 'manage_jobs' %}">Cancel and Go Back</a>
        </p>

    </div>

</div>

{% endblock %}
